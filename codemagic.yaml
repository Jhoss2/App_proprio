workflows:
  android-proprio-build:
    name: Ninja's Corp APK Build
    max_build_duration: 45
    instance_type: mac_mini_m1
    environment:
      groups:
        - sdk_config
      node: 18
      java: 17
    scripts:
      - name: Clean Cache
        script: |
          rm -rf node_modules/.cache
          rm -rf .expo
      - name: Install Dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android
      - name: Fix Gradle
        script: |
          find android -name "gradle.properties" | while read f; do
            sed -i '' '/enableDexingArtifactTransform\.desugaring/d' "$f"
          done
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      
